# Tells Render how to run ADAM WEB. Put this file at the top level of your repository.
services:
  - type: web
    name: adam-web
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    # Keeps your orders and customers when the service restarts.
    disk:
      name: adamweb-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/data/adamweb.db
      # Render makes this long random value for you.
      - key: SESSION_SECRET
        generateValue: true
      # Render asks you for these two when you create the service.
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
